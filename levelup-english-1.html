h3{margin:0 0 6px;font-size:17px}

.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 24px}

label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
select option{color:#111}

.fg{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}

.shake{animation:shake .4s}

#conf{position:fixed;inset:0;z-index:10;pointer-events:none}
.big{font-size:60px;text-align:center;animation:bob 2.5s infinite}
.center{text-align:center}

function mix(a){return shuffle(a)}
function mcq(arr){return {q:arr[0],ans:arr[1],opts:mix(arr.slice(1)),user:null}}
function buildTest(L){
 const lis=pick(LI[L],3).map(x=>({script:x[0],q:x[1],ans:x[2],opts:mix(x.slice(2)),user:null,plays:0}));
 const rp=pick(RD[L],1)[0];
 return [
  {id:'listening',type:'mcq',items:lis},
  {id:'reading',type:'mcq',passage:rp[0],items:rp[1].map(mcq)},
  {id:'grammar',type:'mcq',items:pick(GR[L],4).map(mcq)},
  {id:'vocab',type:'mcq',items:pick(VO[L],4).map(mcq)},
  {id:'writing',type:'txt',prompt:pick(WR[L],1)[0],min:WMIN[L],text:''},
  {id:'speaking',type:'txt',prompt:pick(SP[L],1)[0],min:SMIN[L],text:''}
 ];
}
function startTest(){S.T=buildTest(S.L);S.ti=0;renderSec()}
function renderSec(){

   <div class="card q"><button class="play" id="pl${i}" onclick="say(${i},this)"><span class="ic">🔊</span>Audio ${i+1}<small>2 marta</small></button>
   <button class="linkbtn" onclick="revealScript(${i})">Ovoz chiqmasa — matnni ko'rsatish</button><div id="sc${i}"></div>
   <p style="margin-top:8px"><span class="qn">${i+1}</span>${esc(it.q)}</p>${optsHtml(it,i)}</div>`).join('');
 }else if(sec.id==='reading'){
  body=`<div class="card"><div class="passage">${esc(sec.passage)}</div></div>`+sec.items.map((it,i)=>`<div class="card q"><p><span class="qn">${i+1}</span>${esc(it.q)}</p>${optsHtml(it,i)}</div>`).join('');
 }else if(sec.type==='mcq'){
  body=sec.items.map((it,i)=>`<div class="card q"><p><span class="qn">${i+1}</span>${esc(it.q)}</p>${optsHtml(it,i)}</div>`).join('');

  body=`<div class="card"><h3>${sp?'🎤 Savol':'📝 Topshiriq'}</h3><p style="margin:0;line-height:1.5">${esc(sec.prompt)}</p><p class="sub" style="margin:8px 0 0;font-size:13px">Kamida ${sec.min} ta so'z${sp?' gapiring (yoki yozing)':' yozing'}. Faqat inglizcha.</p></div>

 }

 show(`<div class="top"><small>${k.e} ${k.n}</small><small>${S.ti+1} / ${n}</small></div>

}
function optsHtml(it,i){return it.opts.map((o,j)=>`<button class="opt ${it.user===o?'sel':''}" onclick="pickOpt(${i},${j},this)">${esc(o)}</button>`).join('')}
function pickOpt(i,j,el){const it=S.T[S.ti].items[i];it.user=it.opts[j];el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
const wc=t=>((t||'').toLowerCase().match(/[a-z']+/g)||[]).length;
function onTxt(ta){const s=S.T[S.ti];s.text=ta.value;$('#cnt').textContent=wc(ta.value)+' / '+s.min+" so'z"}
function say(i,btn){
 const it=S.T[S.ti].items[i];
 if(!('speechSynthesis' in window)){toast("Bu qurilmada ovoz ishlamaydi, matn ko'rsatildi");revealScript(i);return}
 if(it.plays>=2){toast("Bu audioni 2 martadan ortiq tinglab bo'lmaydi");return}
 it.plays++;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(it.script);u.lang='en-US';u.rate=[.75,.8,.85,.9,.95,1][S.L];
  u.onstart=()=>btn.classList.add('on');u.onend=u.onerror=()=>btn.classList.remove('on');
  speechSynthesis.speak(u);
 }catch(e){revealScript(i)}
 btn.querySelector('small').textContent=(2-it.plays)+' marta qoldi';
}
function revealScript(i){$('#sc'+i).innerHTML='<div class="script">'+esc(S.T[S.ti].items[i].script)+'</div>'}
let rec=null;
function mic(btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast("Mikrofon bu qurilmada ishlamaydi. Javobni yozib kiriting.");return}
 if(rec){try{rec.stop()}catch(e){}return}
 try{
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';const ta=$('#ans');ta.value=(ta.value+' '+t).trim();onTxt(ta)};
  rec.onend=()=>{rec=null;btn.classList.remove('rec');btn.textContent='🎙️ Gapirish (mikrofon)'};
  rec.onerror=()=>toast("Mikrofon xatosi. Javobni yozib kiriting.");
  rec.start();btn.classList.add('rec');btn.textContent='⏹️ To\'xtatish';
 }catch(e){rec=null;toast("Mikrofonni ishga tushirib bo'lmadi")}
}
function nextSec(){
 if(rec){try{rec.stop()}catch(e){}}
 try{speechSynthesis.cancel()}catch(e){}
 if(S.ti<S.T.length-1){S.ti++;renderSec()}else finish();
}

const CONN=['because','but','however','although','and','so','also','first','firstly','secondly','then','after','finally','while','therefore','moreover','besides','when','if','since','for example','in addition','on the other hand','furthermore','as well','instead','unless','whereas','overall','in conclusion','though','for instance'];
function analyze(text,min,L,speak){
 const t=(text||'').trim();
 const words=(t.toLowerCase().match(/[a-z']+/g)||[]);
 const n=words.length;
 if(n<3)return{score:0,n,notes:[speak?"Javob deyarli aytilmagan yoki kiritilmagan.":"Javob deyarli yozilmagan."],good:[]};
 const len=Math.min(n/min,1.2)/1.2*(speak?50:40);
 const uniq=new Set(words).size;
 const ratio=uniq/n;
 const div=n>=6?clamp((ratio-.4)/.4,0,1)*20:5;
 const low=' '+words.join(' ')+' ';
 let cc=0;CONN.forEach(c=>{if(low.includes(' '+c+' '))cc++});
 const needC=1+Math.ceil(L/1.5);
 const conn=Math.min(cc/needC,1)*15;
 const longR=words.filter(w=>w.length>=7).length/n;
 const lex=Math.min(longR/(.03+L*.03),1)*(speak?15:10);
 let sent=0,mech=0,sc=0;
 if(!speak){
  sc=t.split(/[.!?]+/).filter(s=>s.trim().length>2).length;
  sent=Math.min(sc/(1+Math.ceil(min/15)),1)*10;
  mech=(/^[A-Z]/.test(t)?2.5:0)+(/[.!?]$/.test(t)?2.5:0);
 }
 const score=Math.round(clamp(len+div+conn+lex+sent+mech,0,100));
 const notes=[],good=[];
 if(n<min)notes.push(`So'zlar soni kam: ${n} ta (kamida ${min} ta kerak edi).`);else good.push(`So'zlar soni yetarli (${n} ta).`);
 if(n>=6&&ratio<.55)notes.push("Bir xil so'zlar ko'p takrorlangan — sinonimlardan foydalaning.");
 if(cc<Math.min(needC,2))notes.push("Bog'lovchi so'zlar (because, however, although, also) kam ishlatilgan.");else if(cc>=needC)good.push("Bog'lovchi so'zlardan yaxshi foydalangansiz.");
 if(L>=2&&longR<(.03+L*.03)*.6)notes.push("Murakkabroq va aniqroq so'zlarni ko'proq ishlating.");
 if(!speak){
  if(sc<1+Math.ceil(min/15)*.6)notes.push("Gaplar soni kam yoki nuqta/so'roq belgilari qo'yilmagan.");
  if(!/^[A-Z]/.test(t)||!/[.!?]$/.test(t))notes.push("Bosh harf va tinish belgilariga e'tibor bering.");
 }
 if(score>=70)good.push("Umuman olganda javob mazmunli va tuzilishi yaxshi.");
 return{score,n,notes,good};
}
function finish(){
 show(`<div class="loader"><div class="spin"></div><h2 id="lt">Javoblar tekshirilmoqda…</h2><p class="sub">Aqlli tahlil ishlamoqda</p></div>`);
 const msgs=['Javoblar tekshirilmoqda…','Xatolar aniqlanmoqda…','Daraja hisoblanmoqda…','Natija tayyorlanmoqda…'];
 let i=0;const iv=setInterval(()=>{i++;const e=$('#lt');if(e&&msgs[i])e.textContent=msgs[i]},700);
 setTimeout(()=>{clearInterval(iv);compute();results()},2900);
}
function compute(){
 const secs=S.T.map(sec=>{
  if(sec.type==='mcq'){
   let c=0;const miss=[];sec.items.forEach(it=>{if(it.user===it.ans)c++;else miss.push(it)});
   return{id:sec.id,score:Math.round(c/sec.items.length*100),c,t:sec.items.length,miss,type:'mcq'};
  }
  const a=analyze(sec.text,sec.min,S.L,sec.id==='speaking');
  return{id:sec.id,score:a.score,a,type:'txt'};
 });
 let overall=0;secs.forEach(s=>overall+=s.score*SK[s.id].w);overall=Math.round(overall);
 const L=S.L;
 let real=overall>=85?L+1:overall>=55?L:overall>=35?L-1:L-2;real=clamp(real,0,5);
 const e=clamp(L+(overall-60)/30,0,5);
 const band=Math.round((1.5+e*1.3)*2)/2;
 const verdict=overall>=75?'good':overall>=50?'mid':'bad';
 S.R={secs,overall,real,e,band,verdict};
}
function results(){
 const R=S.R,L=LEVELS[S.L],rl=LEVELS[R.real];
 const vt={good:['Yaxshi','b-good','👏'],mid:["O'rtacha",'b-mid','👍'],bad:['Past','b-bad','💪']}[R.verdict];
 const sorted=R.secs.slice().sort((a,b)=>b.score-a.score);
 const best=sorted[0],worst=sorted[sorted.length-1];
 const ieltsOk=R.band>=6,cefrOk=R.e>=3.8;
 const gapI=Math.max(0,6-R.band).toFixed(1);
 const goal=S.p.goal;
 const circ=2*Math.PI*80;
 const secHtml=R.secs.map(s=>{
  const k=SK[s.id];
  const lab=s.score>=80?"A'lo":s.score>=60?'Yaxshi':s.score>=40?"O'rtacha":'Past';
  const col=s.score>=60?'var(--good)':s.score>=40?'var(--warn)':'var(--bad)';
  let det='';
  if(s.type==='mcq'){
   det+=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px">${s.c} / ${s.t} to'g'ri</div>`;
   if(!s.miss.length)det+=`<div class="ok">✅ Barcha javoblar to'g'ri!</div>`;
   s.miss.forEach(m=>{det+=`<div class="miss">❌ <b>${esc(m.q)}</b><br>Sizning javobingiz: ${m.user?esc(m.user):'<i>javob berilmagan</i>'}<br>To'g'ri javob: <b>${esc(m.ans)}</b></div>`});
  }else{
   det+=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px">${s.a.n} ta so'z</div>`;
   s.a.good.forEach(g=>det+=`<div class="ok">✅ ${g}</div>`);
   s.a.notes.forEach(g=>det+=`<div class="note">⚠️ ${g}</div>`);
  }
  if(S.weak.includes(s.id))det+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">ℹ️ Siz bu yerda qiynalishingizni aytgandingiz — ${s.score<60?"natija buni tasdiqladi.":"lekin natijangiz yaxshi chiqdi!"}</div>`;
  return`<div class="card sec"><div class="hd"><span class="e">${k.e}</span><b>${k.n}</b><span style="color:${col}">${s.score}%</span></div>
  <div class="bar"><div class="sbar" data-w="${s.score}" style="background:${col}"></div></div>
  <div style="font-size:12px;color:var(--muted);margin:5px 0 8px">${lab}</div>${det}</div>`;
 }).join('');
 show(`<div class="center"><h2>${vt[2]} Natijangiz, ${esc(S.p.name)}!</h2></div>
 <div class="card center">
  <div class="ringwrap"><svg width="200" height="200" viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#00d4ff"/></linearGradient></defs>
  <circle cx="100" cy="100" r="80" fill="none" stroke="var(--card2)" stroke-width="16"/>
  <circle class="fg" id="fg" cx="100" cy="100" r="80" fill="none" stroke="url(#gr)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"/></svg>
  <div class="num"><div><b id="tot">0</b><small>/ 100 umumiy ball</small></div></div></div>
  <div style="margin-top:6px"><span class="badge ${vt[1]}">${L.n} darajasi uchun: ${vt[0]} ko'rsatkich</span></div>
  <p class="sub" style="margin:12px 0 0">Eng kuchli: <b>${SK[best.id].n}</b> (${best.score}%) · Eng zaif: <b>${SK[worst.id].n}</b> (${worst.score}%)</p>
 </div>

 <h3 style="margin:20px 4px 0">📋 Bo'limlar bo'yicha tahlil</h3>
 ${secHtml}

 <div class="card"><h3>🧠 Tavsiya</h3>
  <p style="margin:0;line-height:1.55;font-size:14px">${worst.score<70?`Eng ko'p e'tibor kerak bo'lgan bo'lim: <b>${SK[worst.id].n}</b>. ${TIPS[worst.id]}`:`Natijalar tekis va yaxshi. Keyingi darajaga o'tish uchun barcha bo'limlarda mashqni davom ettiring.`}</p>
  ${sorted[sorted.length-2]&&sorted[sorted.length-2].score<60&&sorted[sorted.length-2].id!==worst.id?`<p style="margin:10px 0 0;line-height:1.55;font-size:14px">Shuningdek, <b>${SK[sorted[sorted.length-2].id].n}</b> ham mustahkamlashni talab qiladi. ${TIPS[sorted[sorted.length-2].id]}`:''}
 </div>

 <h3 style="margin:20px 4px 0">🏆 Imtihonga tayyorgarlik</h3>
 <div class="card ready" style="${goal==='IELTS'||goal==='Ikkalasi'?'border-color:var(--a2)':''}"><div class="ic">${ieltsOk?'✅':'❌'}</div><div><b>IELTS (maqsad: 6.0)</b><div style="font-size:14px;margin-top:3px">Taxminiy ball: <b>${R.band.toFixed(1)}</b></div><div style="font-size:13px;color:var(--muted);margin-top:3px">${ieltsOk?'Siz IELTS 6.0 uchun tayyorsiz!':`Hali tayyor emassiz — taxminan ${gapI} ball yetishmayapti.`}</div></div></div>
 <div class="card ready" style="${goal!=='IELTS'?'border-color:var(--a2)':''}"><div class="ic">${cefrOk?'✅':'❌'}</div><div><b>CEFR sertifikat (maqsad: B2)</b><div style="font-size:13px;color:var(--muted);margin-top:3px">${cefrOk?'Siz B2 darajasiga yetgansiz — tayyorsiz!':`Hali tayyor emassiz. Hozirgi daraja: ${rl.cefr}. B2 ga yetish uchun yana o'rganish kerak.`}</div></div></div>

 <div class="card center" style="border-color:var(--a1)">
  <div style="color:var(--muted);font-size:13px">Sizning asl darajangiz</div>
  <div style="font-size:44px;margin:4px 0">${rl.e}</div>
  <h2 class="grad" style="margin:0">${rl.n}</h2>
  <div style="color:var(--muted);margin-top:2px">CEFR: ${rl.cefr}</div>
  ${R.real!==S.L?`<p class="sub" style="margin:10px 0 0;font-size:13px">Siz ${L.n} deb tanlagandingiz, natija esa ${R.real>S.L?'undan yuqori':'undan past'} chiqdi.</p>`:`<p class="sub" style="margin:10px 0 0;font-size:13px">Tanlagan darajangiz natijaga mos keldi.</p>`}
 </div>
 <button class="btn good" onclick="retake()">🎯 Keling, ${rl.n} darajasidagi testni topshiramiz</button>
 <button class="btn ghost" onclick="exitApp()">Chiqish</button>`);
 setTimeout(()=>{
  const fg=$('#fg');if(fg)fg.style.strokeDashoffset=circ*(1-R.overall/100);
  document.querySelectorAll('.sbar').forEach(b=>{b.style.transition='width 1.4s cubic-bezier(.2,.8,.2,1)';b.style.width=b.dataset.w+'%'});
  const el=$('#tot');const t0=performance.now();
  (function step(t){const p=Math.min((t-t0)/1800,1);el.textContent=Math.round(R.overall*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
  if(R.overall>=70)confetti();
 },120);
}
function retake(){S.L=S.R.real;S.retake=true;S.weak=[];readyScreen()}
function exitApp(){
 try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App)Capacitor.Plugins.App.exitApp()}catch(e){}
 try{window.close()}catch(e){}
 show(`<div class="hero"><div class="logo">👋</div><h1>Rahmat, <span class="grad">${esc(S.p.name||'do\'stim')}</span>!</h1><p class="sub">Muvaffaqiyatlar tilaymiz. Har kuni oz-ozdan mashq qilsangiz, maqsadingizga albatta yetasiz!</p><button class="btn" onclick="welcome()">Bosh sahifaga qaytish</button></div>`);
}
function confetti(){
 const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#7c5cff','#00d4ff','#2ee59d','#ffc044','#ff5ca8'];
 const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*5)],vy:2+Math.random()*4,vx:-1.5+Math.random()*3,a:Math.random()*6}));
 let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a+=.05);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<260)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})();
}
welcome();
</script>
</body>
</html>
